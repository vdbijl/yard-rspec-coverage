name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.repository == 'vdbijl/yard-rspec-coverage'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/yard-rspec-coverage
    permissions:
      contents: read
      id-token: write # Trusted Publishing: exchanges a GitHub token for a short-lived RubyGems key.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -e 'print Gem::Specification.load("yard-rspec-coverage.gemspec").version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem build yard-rspec-coverage.gemspec
      - run: gem push yard-rspec-coverage-*.gem
